// ========== DETALHES DO CONTRATO (VERSÃO COMPLETA COM RETIRADA) ==========
async function abrirDetalhesContrato(id) {
  const contract = state.contratos.find(c => c.id == id);
  if (!contract) return;
  
  const tipoConfig = {
    instalacao: { badge: 'badge-green', icon: 'fa-house', text: 'Instalacao' },
    mudanca_endereco: { badge: 'badge-amber', icon: 'fa-right-left', text: 'Mudanca Endereco' },
    mudanca_assinante: { badge: 'badge-indigo', icon: 'fa-user-pen', text: 'Mudanca Assinante' },
    ordem_servico: { badge: 'badge-purple', icon: 'fa-screwdriver-wrench', text: 'OS' },
    retirada_sistema: { badge: 'badge-rose', icon: 'fa-box-open', text: 'Retirada' }
  };
  const tc = tipoConfig[contract.tipo_instalacao] || { badge: 'badge-red', icon: 'fa-file', text: contract.tipo_instalacao || '—' };
  const getStatusBadge = (s) => {
    switch(s) {
      case 'complete': return { badge: 'badge-green', icon: 'fa-check-circle', text: 'Assinado Normal' };
      case 'pending': return { badge: 'badge-pending', icon: 'fa-clock', text: 'Pendente' };
      case 'complete_remote': return { badge: 'badge-remote', icon: 'fa-laptop', text: 'Assinado Remotamente' };
      case 'completed_retirada': return { badge: 'badge-rose', icon: 'fa-box-open', text: 'Retirada Concluida' };
      case 'os_finalizada': return { badge: 'badge-purple', icon: 'fa-check-double', text: 'OS Finalizada' };
      default: return { badge: 'badge-red', icon: 'fa-question', text: 'Desconhecido' };
    }
  };
  const si = getStatusBadge(contract.signature_status);
  const isPending = contract.signature_status === 'pending';
  const isRetirada = contract.tipo_instalacao === 'retirada_sistema';
  const isOSFinalizada = contract.signature_status === 'os_finalizada';
  const isComplete = contract.signature_status === 'complete' || contract.signature_status === 'complete_remote';

  // ===== BUSCAR DADOS COMPLETOS DA RETIRADA =====
  let historicoTentativas = [];
  let dadosRetirada = null;
  
  if (isRetirada) {
    try {
      const res = await authFetch(`/api/contrato/${id}/tentativas`);
      if (res.ok) {
        const data = await res.json();
        if (data.sucesso) {
          historicoTentativas = data.historico_tentativas || [];
          dadosRetirada = data;
        }
      }
    } catch (e) {
      console.warn('Erro ao buscar tentativas de retirada:', e);
      if (contract.tentativas) {
        try {
          const tentativas = typeof contract.tentativas === 'string' 
            ? JSON.parse(contract.tentativas) 
            : contract.tentativas;
          historicoTentativas = Array.isArray(tentativas) ? tentativas : [];
        } catch (_) {}
      }
    }
  }

  // ===== MONTAR HTML DO MODAL =====
  let htmlTentativas = '';
  if (isRetirada && historicoTentativas.length > 0) {
    htmlTentativas = `
      <div style="margin-top: 1rem; border-top: 2px solid var(--border-color); padding-top: 1rem;">
        <div style="font-weight: 700; font-size: 0.85rem; color: var(--text-primary); margin-bottom: 0.75rem;">
          <i class="fas fa-history" style="color: var(--red);"></i> Histórico de Tentativas (${historicoTentativas.length} de 3)
        </div>
        ${historicoTentativas.map((t, idx) => {
          const isSucesso = t.resultado === 'sucesso';
          const eq = t.equipamentos || {};
          const dataFormatada = t.data ? formatarDataBR(t.data) : `Tentativa ${idx + 1}`;
          
          let equipamentosHtml = '';
          if (isSucesso && Object.keys(eq).length > 0) {
            const itens = [];
            if (eq.onu) itens.push(`ONU: ${eq.onu}`);
            if (eq.cordao_monofibra) itens.push(`Cordão: ${eq.cordao_monofibra}`);
            if (eq.pto) itens.push(`PTO: ${eq.pto}`);
            if (eq.roteador) itens.push(`Roteador: ${eq.roteador}`);
            if (eq.suporte_roteador) itens.push(`Suporte: ${eq.suporte_roteador}`);
            if (itens.length > 0) {
              equipamentosHtml = `<div style="font-size: 0.7rem; color: var(--text-secondary); margin-top: 0.15rem;">
                <i class="fas fa-boxes"></i> ${itens.join(' | ')}
              </div>`;
            }
          }
          
          return `
            <div style="background: var(--gray-50); border-radius: var(--radius-sm); padding: 0.65rem 0.9rem; margin-bottom: 0.5rem; border-left: 4px solid ${isSucesso ? '#16A34A' : '#DC2626'};">
              <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.3rem;">
                <span style="font-weight: 600; font-size: 0.8rem; color: var(--text-primary);">
                  ${isSucesso ? '✅' : '❌'} ${isSucesso ? 'Sucesso' : 'Insucesso'}
                </span>
                <span style="font-size: 0.65rem; color: var(--text-secondary); font-family: monospace;">${dataFormatada}</span>
              </div>
              ${t.texto ? `<div style="font-size: 0.75rem; color: var(--text-primary); margin-top: 0.15rem; word-break: break-word;">${escaparHTML(t.texto)}</div>` : ''}
              ${equipamentosHtml}
            </div>
          `;
        }).join('')}
      </div>
    `;
  } else if (isRetirada) {
    htmlTentativas = `
      <div style="margin-top: 1rem; border-top: 2px solid var(--border-color); padding-top: 1rem;">
        <div style="font-weight: 700; font-size: 0.85rem; color: var(--text-secondary);">
          <i class="fas fa-info-circle"></i> Nenhuma tentativa registrada para esta retirada.
        </div>
      </div>
    `;
  }

  const conteudo = `
    <div class="modal-header">
      <h3><i class="fas ${tc.icon}" style="color:var(--red);"></i> Detalhes do Documento</h3>
      <button class="btn-close" onclick="closeModalDinamico()">&times;</button>
    </div>
    <div style="display:flex;gap:.5rem;margin-bottom:1rem;flex-wrap:wrap">
      <span class="badge ${tc.badge}"><i class="fas ${tc.icon}"></i> ${tc.text}</span>
      <span class="badge ${si.badge}"><i class="fas ${si.icon}"></i> ${si.text}</span>
      ${isOSFinalizada ? `<span class="badge badge-purple"><i class="fas fa-check-double"></i> OS Finalizada</span>` : ''}
      ${isRetirada && historicoTentativas.length > 0 ? `<span class="badge badge-rose"><i class="fas fa-list"></i> ${historicoTentativas.length} tentativa${historicoTentativas.length > 1 ? 's' : ''}</span>` : ''}
      ${isRetirada && dadosRetirada?.tentativas_finalizadas ? `<span class="badge badge-green"><i class="fas fa-check-circle"></i> Finalizada</span>` : ''}
    </div>
    ${isPending ? `<div class="aviso-pendente" style="margin-bottom:1rem"><i class="fas fa-exclamation-triangle"></i> Este documento ainda nao foi assinado. O PDF nao esta disponivel para download ate que a assinatura seja concluida.</div>` : ''}
    
    <div style="background:var(--gray-50);border-radius:var(--radius-lg);padding:1rem 1.25rem;margin-bottom:1rem">
      <div class="detail-row"><span class="detail-label">Protocolo</span><span class="detail-value"><span class="proto">${escaparHTML(contract.contrato_id||'—')}</span></span></div>
      <div class="detail-row"><span class="detail-label">Cliente</span><span class="detail-value" style="font-weight:600">${escaparHTML(contract.cliente_nome||'—')}</span></div>
      ${contract.campo_cliente?`<div class="detail-row"><span class="detail-label">Nº Cliente</span><span class="detail-value"><span class="badge badge-blue">${escaparHTML(contract.campo_cliente)}</span></span></div>`:''}
      ${contract.campo_ctop?`<div class="detail-row"><span class="detail-label">CTOP</span><span class="detail-value"><span class="badge badge-amber">${escaparHTML(contract.campo_ctop)}</span></span></div>`:''}
      ${contract.campo_db?`<div class="detail-row"><span class="detail-label">DB</span><span class="detail-value"><span class="badge badge-teal">${escaparHTML(contract.campo_db)}</span></span></div>`:''}
      <div class="detail-row"><span class="detail-label">Tecnico</span><span class="detail-value">${escaparHTML(contract.tecnico_nome||'—')}</span></div>
      <div class="detail-row"><span class="detail-label">Data/Hora</span><span class="detail-value mono" style="font-size:.8rem">${formatarDataBR(contract.data_hora)}</span></div>
      ${contract.signature_status==='complete_remote'&&contract.signed_at?`<div class="detail-row"><span class="detail-label">Assinado em</span><span class="detail-value mono" style="font-size:.8rem;color:#0369A1"><i class="fas fa-laptop"></i> ${formatarDataBR(contract.signed_at)}</span></div>`:''}
      ${contract.email_sent_to&&contract.signature_status==='pending'?`<div class="detail-row"><span class="detail-label">Link enviado para</span><span class="detail-value" style="font-size:.8rem;color:#92400E"><i class="fas fa-envelope"></i> ${escaparHTML(contract.email_sent_to)}</span></div>`:''}
      ${contract.radiusnet_id_os?`<div class="detail-row"><span class="detail-label">ID OS RadiusNet</span><span class="detail-value"><span class="badge badge-blue">${escaparHTML(contract.radiusnet_id_os)}</span></span></div>`:''}
      ${contract.radiusnet_id_atendimento?`<div class="detail-row"><span class="detail-label">ID Atendimento</span><span class="detail-value"><span class="badge badge-purple">${escaparHTML(contract.radiusnet_id_atendimento)}</span></span></div>`:''}
      ${contract.radiusnet_finalizado == 1 ? `<div class="detail-row"><span class="detail-label">OS Finalizada</span><span class="detail-value"><span class="badge badge-green"><i class="fas fa-check-circle"></i> ${formatarDataBR(contract.radiusnet_finalizado_data) || 'Sim'}</span></span></div>` : ''}
      ${contract.txt_content?`<div class="detail-row"><span class="detail-label">TXT anexado</span><span class="detail-value"><span class="badge badge-green"><i class="fas fa-check-circle"></i> Disponivel</span></span></div>`:''}
      
      ${isRetirada && dadosRetirada?.tentativas_finalizadas ? `
        <div class="detail-row">
          <span class="detail-label">Status Retirada</span>
          <span class="detail-value">
            <span class="badge badge-green"><i class="fas fa-check-circle"></i> Finalizada com Sucesso</span>
          </span>
        </div>
      ` : ''}
      
      ${isComplete ? `
        <div class="detail-row">
          <span class="detail-label">Link do PDF</span>
          <span class="detail-value" style="display:flex;align-items:center;gap:0.5rem;flex-wrap:wrap;">
            <span style="font-family:monospace;font-size:.75rem;word-break:break-all;color:var(--text-secondary);">${window.location.origin}/api/pdf/${contract.id}</span>
            <button onclick="copiarLink('${window.location.origin}/api/pdf/${contract.id}', 'Link copiado para a area de transferencia!')" class="btn btn-copy-link btn-sm" style="font-size:0.65rem;padding:0.15rem 0.5rem;">
              <i class="fas fa-copy"></i> Copiar
            </button>
          </span>
        </div>` : ''
      }
    </div>
    
    ${isRetirada ? htmlTentativas : ''}
    
    ${!isRetirada ? `
    <div style="margin-bottom:1.25rem">
      <label style="margin-bottom:.5rem;display:flex;align-items:center;gap:.4rem"><i class="fas fa-align-left" style="color:var(--red);font-size:.8rem"></i>Descricao da OS</label>
      ${contract.os_descricao?`<div class="detail-os-box"><p style="font-size:.875rem;color:var(--text-primary);line-height:1.7;white-space:pre-wrap;margin:0">${escaparHTML(contract.os_descricao)}</p></div>`:`<p style="font-size:.8125rem;color:var(--text-secondary);font-style:italic;margin-top:.25rem">Nenhuma descricao informada para esta OS.</p>`}
    </div>` : ''}
    
    <div style="display:flex;gap:.5rem;flex-wrap:wrap">
      ${isPending ? `
        <div style="flex:1;text-align:center">
          <span style="display:inline-block;padding:.55rem 1rem;background:var(--gray-100);color:var(--text-secondary);border-radius:var(--radius);font-size:.8125rem;font-weight:600;width:100%">
            <i class="fas fa-file-pdf"></i> PDF indisponivel (pendente)
          </span>
        </div>` : 
        `<a href="/api/pdf/${contract.id}" target="_blank" class="btn btn-green" style="flex:1;justify-content:center"><i class="fas fa-download"></i> Download PDF</a>`
      }
      ${contract.txt_content ? 
        `<button onclick="baixarTxt('${contract.id}')" class="btn" style="flex:1;justify-content:center;background:#DBEAFE;color:#1E40AF;border:2px solid #BFDBFE"><i class="fas fa-file-lines"></i> Download TXT</button>` : ''
      }
      ${isPending ? 
        `<button id="btnEnviarLinkDetalhes" class="btn btn-blue" style="flex:1;justify-content:center"><i class="fas fa-link"></i> Enviar Link</button>` : 
        `<button id="btnEnviarDetalhes" class="btn btn-primary" style="flex:1;justify-content:center"><i class="fas fa-envelope"></i> Enviar</button>`
      }
      ${isComplete ? 
        `<button onclick="abrirModalCopiarLink('${contract.id}')" class="btn btn-copy-link" style="flex:1;justify-content:center"><i class="fas fa-copy"></i> Copiar Link</button>` : ''
      }
      ${contract.radiusnet_id_atendimento && !isOSFinalizada && contract.tipo_instalacao === 'ordem_servico' ? 
        `<button onclick="finalizarOSAdmin('${contract.id}', '${contract.radiusnet_id_atendimento}')" class="btn btn-purple" style="flex:1;justify-content:center"><i class="fas fa-clipboard-check"></i> Finalizar OS</button>` : ''
      }
    </div>`;
  
  const overlay = showModalDinamico(conteudo, '600px');
  
  document.getElementById('fecharDetalhes')?.addEventListener('click', closeModalDinamico);
  if (isPending) {
    document.getElementById('btnEnviarLinkDetalhes')?.addEventListener('click', () => { closeModalDinamico(); abrirModalEnvioLink(id); });
  } else {
    document.getElementById('btnEnviarDetalhes')?.addEventListener('click', () => { closeModalDinamico(); abrirModalMetodoEnvio(id, false); });
  }
}

// ========== ENVIO DE LINK ==========
function abrirModalEnvioLink(id) {
  const contract = state.contratos.find(c => c.id == id);
  if (!contract) return;
  const conteudo = `
    <div class="modal-header">
      <h3><i class="fas fa-link" style="color:#2563EB;"></i> Enviar Link de Assinatura</h3>
      <button class="btn-close" onclick="closeModalDinamico()">&times;</button>
    </div>
    <div style="display:flex;align-items:center;gap:.75rem;margin-bottom:1rem;padding:.75rem;background:var(--gray-50);border-radius:var(--radius);border:1px solid var(--border-color);">
      <div style="width:36px;height:36px;background:#FEF3C7;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#D97706;font-size:.9rem;flex-shrink:0;"><i class="fas fa-file-signature"></i></div>
      <div style="flex:1;min-width:0;">
        <div style="font-weight:600;font-size:.85rem;color:var(--text-primary);">${escaparHTML(contract.contrato_id)}</div>
        <div style="font-size:.7rem;color:var(--text-secondary);">${escaparHTML(contract.cliente_nome||'—')}</div>
      </div>
    </div>
    <div class="type-info" style="margin-bottom:1rem;font-size:.75rem;"><i class="fas fa-clock"></i> O link sera valido por <strong>24 horas</strong>.</div>
    <div class="login-field"><label>E-mail do cliente</label><input id="linkEmail" type="email" placeholder="cliente@email.com"><div id="linkEmailError" class="field-error-msg" style="display:none">Informe um e-mail valido</div></div>
    <div style="display:flex;gap:.5rem;margin-top:.5rem">
      <button id="cancelLinkBtn" class="btn btn-ghost" style="flex:1;justify-content:center">Cancelar</button>
      <button id="sendLinkBtn" class="btn btn-blue" style="flex:1;justify-content:center"><i class="fas fa-paper-plane"></i> Enviar Link</button>
    </div>`;
  showModalDinamico(conteudo);
  
  document.getElementById('cancelLinkBtn')?.addEventListener('click', closeModalDinamico);
  document.getElementById('sendLinkBtn')?.addEventListener('click', async () => {
    const email = document.getElementById('linkEmail').value.trim();
    if (!email.match(/^[^\s@]+@[^\s@]+\.[^\s@]+$/)) {
      document.getElementById('linkEmailError').style.display = 'block';
      return;
    }
    const btn = document.getElementById('sendLinkBtn');
    btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Enviando...';
    await enviarLinkAssinatura(contract.id, email);
    closeModalDinamico();
  });
}

// ========== METODO DE ENVIO ==========
function abrirModalMetodoEnvio(id, isPending = false) {
  const contract = state.contratos.find(c => c.id == id);
  if (!contract) return;
  const nomeCliente = contract.cliente_nome || '—';
  
  const conteudo = `
    <div class="modal-header">
      <h3><i class="fas fa-envelope" style="color:var(--red);"></i> Enviar documento</h3>
      <button class="btn-close" onclick="closeModalDinamico()">&times;</button>
    </div>
    <div style="display:flex;align-items:center;gap:.75rem;margin-bottom:1rem;padding:.75rem;background:var(--gray-50);border-radius:var(--radius);border:1px solid var(--border-color);">
      <div style="width:36px;height:36px;background:#DBEAFE;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#1E40AF;font-size:.9rem;flex-shrink:0;"><i class="fas fa-file-pdf"></i></div>
      <div style="flex:1;min-width:0;">
        <div style="font-weight:600;font-size:.85rem;color:var(--text-primary);">${escaparHTML(contract.contrato_id)}</div>

    <div class="login-field"><label>E-mail do cliente</label><input id="envioEmailDest" type="email" placeholder="cliente@email.com"><div id="envioEmailError" class="field-error-msg" style="display:none">Informe um e-mail valido</div></div>
    <div class="login-field"><label>Mensagem (opcional)</label><textarea id="envioEmailMsg" placeholder="Ola, segue seu documento..." rows="3" style="resize:none"></textarea></div>

      <button id="cancelEnvioBtn" class="btn btn-ghost" style="flex:1;justify-content:center">Cancelar</button>
      <button id="sendEnvioBtn" class="btn btn-primary" style="flex:1;justify-content:center"><i class="fas fa-paper-plane"></i> Enviar</button>
    </div>`;
  showModalDinamico(conteudo, '400px');
  
  document.getElementById('cancelEnvioBtn')?.addEventListener('click', closeModalDinamico);
  document.getElementById('sendEnvioBtn')?.addEventListener('click', async () => {
    const email = document.getElementById('envioEmailDest').value.trim();
    if (!email.match(/^[^\s@]+@[^\s@]+\.[^\s@]+$/)) {
      document.getElementById('envioEmailError').style.display = 'block';
      return;
    }
    const btn = document.getElementById('sendEnvioBtn');
    btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Enviando...';
    const msg = document.getElementById('envioEmailMsg').value.trim();
    await enviarEmail(contract.id, email, msg, contract.contrato_id, nomeCliente);
    closeModalDinamico();
  });
}

  const buscarBtn = document.getElementById('buscarRadiusnetBtn');
if (buscarBtn) {
    buscarBtn.addEventListener('click', async () => {

            showToast('Informe o ID do cliente plano', 'error');
            return;

        await buscarDadosClienteInstalacao(id);
    });
}

  const buscarOsBtn = document.getElementById('buscarOsBtn');
  if (buscarOsBtn) {
    buscarOsBtn.addEventListener('click', async function() {
      const id = document.getElementById('radiusnetIdOs').value.trim();
      if (!id) return showToast('Informe o ID da OS', 'error');
      
      const textoOriginal = this.innerHTML;
      this.disabled = true;
      this.innerHTML = '<span class="spinner-small"></span> Buscando...';
      
      const statusEl = document.getElementById('radiusnetOsStatus');
      if (statusEl) {
        statusEl.innerHTML = '<div class="os-loading-indicator"><span class="spinner-small"></span> Buscando OS...</div>';
      }
      
      try {
        const dados = await buscarDadosCompletosOS(id);
        
        if (dados) {
          const nomeCliente = dados.cliente_nome || dados.nome || 'Cliente nao informado';
          
          if (statusEl) {
            statusEl.innerHTML = '<div class="os-loading-indicator"><span class="spinner-small"></span> Baixando PDF da OS...</div>';
          }
          
          const controller = new AbortController();
          const timeoutId = setTimeout(() => controller.abort(), 40000);
          
          let pdfRes;
          try {
            pdfRes = await authFetch(`/api/radiusnet/os-pdf/${id}`, { signal: controller.signal });
          } finally {
            clearTimeout(timeoutId);
          }
          
          if (pdfRes.ok) {
            const blob = await pdfRes.blob();
            const file = new File([blob], `os_${id}.pdf`, { type: 'application/pdf' });
            state.selectedPdf = file;
            atualizarZona('zonePdf', file);
            state.radiusnetIdOs = id;
            
            if (statusEl) {
              statusEl.innerHTML = `<i class="fas fa-check-circle" style="color:#16A34A"></i> PDF da OS ${id} baixado! Cliente: ${nomeCliente}`;
            }
            
            document.getElementById('nomeOsRadius').value = `OS ${id} - ${nomeCliente}`;
            
            const docNome = document.getElementById('docNome');
            if (docNome && !docNome.value) {
              docNome.value = `OS ${id} - ${nomeCliente}`;
            }
          } else {
            let erroMsg = 'Erro ao baixar OS';
            try {
              const data = await pdfRes.json();
              erroMsg = data.erro || erroMsg;
            } catch (_) {}
            if (statusEl) {
              statusEl.innerHTML = `<i class="fas fa-exclamation-circle" style="color:#DC2626"></i> ${erroMsg}`;
            }
            showToast(erroMsg, 'error');
          }
        }
      } catch (e) {
        console.error('Erro ao buscar OS:', e);
        if (e.name === 'AbortError') {
          if (statusEl) {
            statusEl.innerHTML = `<i class="fas fa-exclamation-circle" style="color:#DC2626"></i> Timeout ao gerar o PDF da OS. Tente novamente.`;
          }
          showToast('Timeout ao baixar PDF da OS (mais de 40s). Verifique o servidor.', 'error');
        } else {
          if (statusEl) {
            statusEl.innerHTML = `<i class="fas fa-exclamation-circle" style="color:#DC2626"></i> Erro de conexao: ${e.message}`;
          }
          showToast('Erro de conexao ao buscar OS', 'error');
        }
      } finally {
        this.disabled = false;
        this.innerHTML = textoOriginal;
      }
    });
  }

  const listarOsBtn = document.getElementById('listarOsBtn');
  if (listarOsBtn) {
    listarOsBtn.addEventListener('click', () => {
      const idCliente = document.getElementById('radiusnetId')?.value?.trim();
      if (idCliente) {
        listarOSRadiusNet(idCliente);
      } else {
        showModalDinamico(`
          <div class="modal-header">
            <h3><i class="fas fa-search" style="color:#2563EB;"></i> Informe o ID do Cliente Plano</h3>
            <button class="btn-close" onclick="closeModalDinamico()">&times;</button>
          </div>
          <div class="login-field">
            <label>ID Cliente Plano</label>
            <input id="listarOsClienteId" type="text" placeholder="Ex: 12345" style="width:100%;padding:10px;border:2px solid var(--border-color);border-radius:8px;background:var(--bg-card);color:var(--text-primary);">
          </div>
          <div style="display:flex;gap:.5rem;margin-top:12px;">
            <button onclick="closeModalDinamico()" class="btn btn-ghost" style="flex:1;justify-content:center;">Cancelar</button>
            <button onclick="listarOSRadiusNet(document.getElementById('listarOsClienteId').value.trim()); closeModalDinamico();" class="btn btn-blue" style="flex:1;justify-content:center;"><i class="fas fa-search"></i> Listar</button>
          </div>
        `, '400px');
      }
    });
  }

  document.getElementById('cancelUploadBtn')?.addEventListener('click', closeModalDinamico);
  document.getElementById('salvarTemplateBtn')?.addEventListener('click', async () => {
    if (!state.selectedPdf) return showToast('Selecione o PDF principal', 'error');
    
    if ((isInstalacao || isMudancaEndereco || isMudancaAssinante) && !state.selectedTxt) {
      return showToast('TXT obrigatorio para este tipo', 'error');
    }
    if (isInstalacao && !state.selectedOs) {
      return showToast('OS obrigatoria para instalacao', 'error');
    }

    const fd = new FormData();
    fd.append('arquivo', state.selectedPdf);
    if (state.selectedTxt) fd.append('txtfile', state.selectedTxt);
    if (state.selectedOs) fd.append('osfile', state.selectedOs);
    if (state.selectedRetirada) fd.append('retirada_pdf', state.selectedRetirada);

    const dataAgendada = document.getElementById('dataAgendada')?.value || '';
    fd.append('data_agendada', dataAgendada);

    let nomeFinal = document.getElementById('docNome').value.trim();
    
    if (!nomeFinal && isOS && state.radiusnetIdOs) {
      const nomeCliente = document.getElementById('clienteNomeOs')?.value?.trim() || 'Cliente';
      nomeFinal = `OS ${state.radiusnetIdOs} - ${nomeCliente}`;
    }
    
    if (!nomeFinal) {
      nomeFinal = state.selectedPdf.name.replace('.pdf', '');
    }
    
    fd.append('nome', nomeFinal);

    const mensagemExtra = document.getElementById('mensagemExtra')?.value?.trim() || '';
    fd.append('tipo', tipo);
    fd.append('mensagem_extra', mensagemExtra);

    if (isInstalacao && state.radiusnetIdClientePlano) {
      fd.append('radiusnet_id_cliente_plano', state.radiusnetIdClientePlano);
      fd.append('cliente_nome', state.radiusnetClienteNome || '');
    }

    if (isOS && state.radiusnetIdOs) {
      fd.append('radiusnet_id_os', state.radiusnetIdOs);
      const nomeCliente = document.getElementById('clienteNomeOs')?.value?.trim() || '';
      fd.append('cliente_nome', nomeCliente);
    }

    const btn = document.getElementById('salvarTemplateBtn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Salvando...';
    try {
      const res = await authFetch('/api/templates', { method: 'POST', body: fd });
      const data = await res.json();
      if (data.sucesso) {
        showToast('Template salvo com sucesso!');
        closeModalDinamico();
        if (state.mostrarTodosTemplates) {
          await carregarTodosTemplates();
        } else {
          await carregarTemplatesDoDia();
        }
        renderizarConteudoPrincipal();
      } else {
        showToast(data.erro || 'Erro ao salvar', 'error');
      }
    } catch (e) {
      showToast('Erro de conexao', 'error');
    } finally {
      btn.disabled = false;
      btn.innerHTML = '<i class="fas fa-floppy-disk"></i> Salvar';
    }
  });
}

function configurarUploadZone(zoneId, inputId, callback) {
  const zone = document.getElementById(zoneId);
  const input = document.getElementById(inputId);
  if (!zone || !input) return;
  zone.addEventListener('click', () => input.click());
  zone.addEventListener('dragover', (e) => { e.preventDefault(); zone.classList.add('drag'); });
  zone.addEventListener('dragleave', () => zone.classList.remove('drag'));
  zone.addEventListener('drop', (e) => { e.preventDefault(); zone.classList.remove('drag'); if (e.dataTransfer.files[0]) callback(e.dataTransfer.files[0]); });
  input.addEventListener('change', () => { if (input.files[0]) callback(input.files[0]); });
}

function atualizarZona(zoneId, file) {
  const zone = document.getElementById(zoneId);
  if (!zone || !file) return;
  zone.classList.add('has-file');
  const icon = zone.querySelector('.upload-zone-icon i');
  if (icon) icon.className = 'fas fa-circle-check';
  const label = zone.querySelector('.upload-zone-label');
  if (label) label.textContent = file.name;
  const req = zone.querySelector('.upload-zone-req');
  if (req) req.style.display = 'none';
  const optional = zone.querySelector('.upload-zone-optional');
  if (optional) optional.style.display = 'none';
}

  console.log('App iniciado (vanilla)');
  initTheme();
  verificarSessao();
  setInterval(() => { if (state.logged && document.visibilityState === 'visible') carregarDados(); }, 30000);
});
