<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes"/>
<title>Painel Admin · Melolink Internet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  
  :root {
    --red: #DC2626;
    --red-dark: #B91C1C;
    --red-darker: #991B1B;
    --red-light: #FEF2F2;
    --red-mid: #FECACA;
    --red-100: #FEE2E2;
    --white: #FFFFFF;
    --off-white: #FEFEFE;
    --gray-50: #F9FAFB;
    --gray-100: #F3F4F6;
    --gray-200: #E5E7EB;
    --gray-300: #D1D5DB;
    --gray-400: #9CA3AF;
    --gray-500: #6B7280;
    --gray-600: #4B5563;
    --gray-700: #374151;
    --gray-800: #1F2937;
    --gray-900: #111827;
    --bg-body: #F5F5F5;
    --bg-card: #FFFFFF;
    --border-color: #E5E7EB;
    --text-primary: #111827;
    --text-secondary: #6B7280;
    --shadow-sm: 0 1px 2px rgba(0,0,0,.05);
    --shadow: 0 4px 6px rgba(0,0,0,.07), 0 2px 4px rgba(0,0,0,.04);
    --shadow-lg: 0 10px 25px rgba(0,0,0,.1), 0 4px 10px rgba(0,0,0,.05);
    --shadow-red: 0 4px 15px rgba(220,38,38,.25);
    --radius-sm: 8px;
    --radius: 12px;
    --radius-lg: 16px;
    --radius-xl: 24px;
    --transition: all 0.2s ease;
  }

  [data-theme="dark"] {
    --bg-body: #0F0F1A;
    --bg-card: #1A1A2E;
    --border-color: #2A2A3E;
    --text-primary: #E8E8F0;
    --text-secondary: #9CA3AF;
    --gray-50: #1A1A2A;
    --gray-100: #22223A;
    --gray-200: #2D2D45;
    --gray-300: #3D3D55;
    --gray-400: #9CA3AF;
    --gray-500: #B0B0B8;
    --gray-700: #D1D1D6;
    --gray-900: #E8E8E8;
    --red-light: #2A1215;
    --red-mid: #4A1A1A;
    --red-100: #2A1215;
    --shadow-sm: 0 1px 2px rgba(0,0,0,.3);
    --shadow: 0 4px 6px rgba(0,0,0,.4);
    --shadow-lg: 0 10px 30px rgba(0,0,0,.6);
    --shadow-red: 0 4px 15px rgba(220,38,38,.3);
  }

  html { font-size: 14px; }
  body { 
    font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
    background: var(--bg-body); 
    color: var(--text-primary); 
    line-height: 1.5; 
    min-height: 100vh;
    transition: background 0.3s ease, color 0.3s ease;
  }
  
  code, .mono { font-family: 'DM Mono', 'Courier New', monospace; }

  @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes shake { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-6px); } 60% { transform: translateX(6px); } }
  @keyframes modalIn { from { opacity: 0; transform: scale(.95) translateY(8px); } to { opacity: 1; transform: scale(1) translateY(0); } }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .5; } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes progressBar { 0% { width: 0%; } 100% { width: 100%; } }
  @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

  ::-webkit-scrollbar { width: 5px; height: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--gray-300); border-radius: 99px; }
  [data-theme="dark"] ::-webkit-scrollbar-thumb { background: var(--gray-600); }

  input, select, textarea {
    font-family: inherit; 
    font-size: .875rem; 
    color: var(--text-primary);
    background: var(--bg-card); 
    border: 2px solid var(--border-color);
    border-radius: var(--radius); 
    padding: .6rem .9rem; 
    outline: none;
    transition: border-color .15s, box-shadow .15s, background .3s ease; 
    width: 100%;
  }
  input:focus, select:focus, textarea:focus { 
    border-color: var(--red); 
    box-shadow: 0 0 0 4px rgba(220,38,38,.15); 
  }
  input::placeholder, textarea::placeholder { color: var(--gray-400); }
  
  select { 
    appearance: none; 
    background-image: url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%239CA3AF' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"); 
    background-repeat: no-repeat; 
    background-position: right .75rem center; 
    padding-right: 2rem; 
  }
  [data-theme="dark"] select {
    background-image: url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%239CA3AF' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
  }
  
#clienteNomeRadius {
    transition: all 0.3s ease;
    font-weight: 600;
    font-size: 1rem;
    padding: 0.75rem 1rem;
}
#clienteNomeRadius.preenchido {
    background: #F0FDF4 !important;
    border-color: #86EFAC !important;
    color: #166534 !important;
}
[data-theme="dark"] #clienteNomeRadius.preenchido {
    background: #0D2818 !important;
    border-color: #16A34A !important;
    color: #4ADE80 !important;
}
#clienteNomeRadius.buscando {
    background: #FEF3C7 !important;
    border-color: #F59E0B !important;
    color: #92400E !important;
}
[data-theme="dark"] #clienteNomeRadius.buscando {
    background: #2A1F0A !important;
    border-color: #D97706 !important;
    color: #FBBF24 !important;
}

  label { 
    font-size: .72rem; 
    font-weight: 600; 
    color: var(--text-secondary); 
    display: block; 
    margin-bottom: .3rem; 
    letter-spacing: .03em; 
    text-transform: uppercase; 
  }

  .btn { 
    display: inline-flex; 
    align-items: center; 
    gap: .4rem; 
    font-family: inherit; 
    font-size: .8125rem; 
    font-weight: 600; 
    border: none; 
    cursor: pointer; 
    border-radius: var(--radius); 
    padding: .55rem 1rem; 
    transition: all .15s; 
    white-space: nowrap; 
    text-decoration: none; 
  }
  .btn-primary { background: var(--red); color: #fff; } 
  .btn-primary:hover { background: var(--red-dark); box-shadow: var(--shadow-red); }
  .btn-white { background: var(--bg-card); color: var(--red); border: 2px solid var(--red); } 
  .btn-white:hover { background: var(--red-light); }
  .btn-ghost { background: transparent; color: var(--text-secondary); border: 2px solid var(--border-color); } 
  .btn-ghost:hover { background: var(--gray-50); border-color: var(--gray-300); color: var(--text-primary); }
  .btn-sm { padding: .35rem .7rem; font-size: .75rem; } 
  .btn-icon { padding: .4rem .5rem; min-width: 34px; justify-content: center; }
  .btn:disabled { opacity: .45; cursor: not-allowed; pointer-events: none; }
  .btn-danger-ghost { background: transparent; color: var(--red); border: 2px solid var(--red-mid); } 
  .btn-danger-ghost:hover { background: var(--red-light); border-color: var(--red); }
  .btn-green { background: #16A34A; color: #fff; } 
  .btn-green:hover { background: #15803D; }
  .btn-outline { background: var(--bg-card); color: var(--text-primary); border: 2px solid var(--border-color); } 
  .btn-outline:hover { background: var(--gray-50); border-color: var(--gray-300); }
  .btn-blue { background: #2563eb; color: #fff; } 
  .btn-blue:hover { background: #1d4ed8; }
  .btn-purple { background: #7C3AED; color: #fff; } 
  .btn-purple:hover { background: #6D28D9; }
  .btn-rose { background: #E11D48; color: #fff; } 
  .btn-rose:hover { background: #BE123C; }
  .btn-edit-senha { background: #F59E0B; color: #fff; } 
  .btn-edit-senha:hover { background: #D97706; }
  .btn-copy-link { background: #0EA5E9; color: #fff; }
  .btn-copy-link:hover { background: #0284C7; }
  .btn-indigo { background: #4F46E5; color: #fff; }
  .btn-indigo:hover { background: #4338CA; }

  .badge { 
    display: inline-flex; 
    align-items: center; 
    gap: .3rem; 
    font-size: .7rem; 
    font-weight: 600; 
    padding: .2rem .6rem; 
    border-radius: 20px; 
    letter-spacing: .01em; 
  }
  .badge-red { background: var(--red-100); color: var(--red-darker); border: 1px solid var(--red-mid); }
  .badge-green { background: #DCFCE7; color: #166534; border: 1px solid #BBF7D0; }
  [data-theme="dark"] .badge-green { background: #0D2818; color: #4ADE80; border-color: #166534; }
  .badge-amber { background: #FEF3C7; color: #92400E; border: 1px solid #FDE68A; }
  [data-theme="dark"] .badge-amber { background: #2A1F0A; color: #FBBF24; border-color: #78350F; }
  .badge-purple { background: #F3E8FF; color: #6B21A8; border: 1px solid #E9D5FF; }
  [data-theme="dark"] .badge-purple { background: #1E1028; color: #A78BFA; border-color: #4C1D95; }
  .badge-blue { background: #DBEAFE; color: #1E40AF; border: 1px solid #BFDBFE; }
  [data-theme="dark"] .badge-blue { background: #0A1A2A; color: #60A5FA; border-color: #1E3A5F; }
  .badge-teal { background: #CCFBF1; color: #115E59; border: 1px solid #99F6E4; }
  [data-theme="dark"] .badge-teal { background: #0A1A18; color: #2DD4BF; border-color: #115E59; }
  .badge-pending { background: #FEF3C7; color: #92400E; border: 1px solid #FDE68A; animation: pulse 2s infinite; }
  [data-theme="dark"] .badge-pending { background: #2A1F0A; color: #FBBF24; border-color: #78350F; }
  .badge-remote { background: #E0F2FE; color: #0369A1; border: 1px solid #BAE6FD; }
  [data-theme="dark"] .badge-remote { background: #0A1A2A; color: #38BDF8; border-color: #1E3A5F; }
  .badge-rose { background: #FFE4E6; color: #9F1239; border: 1px solid #FECDD3; }
  [data-theme="dark"] .badge-rose { background: #2A0A12; color: #FB7185; border-color: #4C0A1A; }
  .badge-indigo { background: #E0E7FF; color: #3730A3; border: 1px solid #C7D2FE; }
  [data-theme="dark"] .badge-indigo { background: #1A1A3A; color: #818CF8; border-color: #3730A3; }

  .card { 
    background: var(--bg-card); 
    border: 1px solid var(--border-color); 
    border-radius: var(--radius-lg); 
    overflow: hidden; 
    box-shadow: var(--shadow-sm);
    transition: background 0.3s ease, border-color 0.3s ease;
  }

  .data-table { width: 100%; border-collapse: collapse; }
  .data-table thead th { 
    background: var(--red); 
    color: #fff; 
    font-size: .68rem; 
    font-weight: 700; 
    text-transform: uppercase; 
    letter-spacing: .08em; 
    padding: .75rem 1rem; 
    text-align: left; 
    white-space: nowrap; 
    position: sticky; 
    top: 0; 
    z-index: 5; 
  }
  .data-table tbody td { 
    padding: .8rem 1rem; 
    border-bottom: 1px solid var(--border-color); 
    font-size: .8125rem; 
    color: var(--text-primary); 
    vertical-align: middle; 
  }
  .data-table tbody tr:last-child td { border-bottom: none; } 
  .data-table tbody tr:hover td { background: var(--red-light); }
  
  .table-wrap { 
    overflow-x: auto; 
    border-radius: 0 0 var(--radius-lg) var(--radius-lg); 
    max-height: 60vh; 
    overflow-y: auto; 
  }

  .stat-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: .875rem; }
  @media(max-width:900px) { .stat-grid { grid-template-columns: repeat(3, 1fr); } }
  @media(max-width:600px) { .stat-grid { grid-template-columns: repeat(2, 1fr); } }
  
  .stat-card { 
    background: var(--bg-card); 
    border: 1px solid var(--border-color); 
    border-radius: var(--radius-lg); 
    padding: 1.2rem 1.3rem; 
    box-shadow: var(--shadow-sm); 
    transition: all .2s; 
    border-left: 4px solid var(--red); 
  }
  .stat-card:hover { box-shadow: var(--shadow-lg); transform: translateY(-2px); }
  .stat-card .stat-top { display: flex; align-items: center; justify-content: space-between; }
  .stat-icon { 
    width: 44px; 
    height: 44px; 
    border-radius: var(--radius); 
    display: flex; 
    align-items: center; 
    justify-content: center; 
    flex-shrink: 0; 
    font-size: 1.1rem; 
  }
  .stat-val { 
    font-size: 1.9rem; 
    font-weight: 700; 
    line-height: 1.1; 
    letter-spacing: -.03em; 
    color: var(--text-primary); 
  }
  .stat-lbl { font-size: .75rem; color: var(--text-secondary); margin-top: .15rem; font-weight: 500; }
  .stat-trend { font-size: .65rem; font-weight: 600; margin-left: .3rem; }
  .stat-trend.up { color: #16A34A; }
  .stat-trend.down { color: #DC2626; }

  .stat-card.instalacao { border-left-color: #16A34A; }
  .stat-card.instalacao .stat-icon { background: #D1FAE5; color: #059669; }
  .stat-card.mudanca { border-left-color: #F59E0B; }
  .stat-card.mudanca .stat-icon { background: #FEF3C7; color: #D97706; }
  .stat-card.mudanca_assinante { border-left-color: #4F46E5; }
  .stat-card.mudanca_assinante .stat-icon { background: #E0E7FF; color: #4F46E5; }
  .stat-card.os { border-left-color: #7C3AED; }
  .stat-card.os .stat-icon { background: #EDE9FE; color: #6D28D9; }
  .stat-card.hoje { border-left-color: #DC2626; }
  .stat-card.hoje .stat-icon { background: #FEE2E2; color: #DC2626; }

  .tabs { 
    display: flex; 
    gap: .25rem; 
    background: var(--gray-50); 
    border: 1px solid var(--border-color); 
    border-radius: var(--radius-lg); 
    padding: .3rem; 
  }
  .tab { 
    flex: 1; 
    display: flex; 
    align-items: center; 
    justify-content: center; 
    gap: .4rem; 
    padding: .65rem; 
    border-radius: var(--radius); 
    font-size: .8125rem; 
    font-weight: 600; 
    cursor: pointer; 
    transition: all .15s; 
    color: var(--text-secondary); 
    border: none; 
    background: transparent; 
  }
  .tab.active { background: var(--red); color: #fff; box-shadow: var(--shadow-red); }
  .tab:not(.active):hover { background: var(--red-light); color: var(--red); }
  .tab-count { 
    font-size: .68rem; 
    padding: .1rem .5rem; 
    border-radius: 99px; 
    font-weight: 700; 
  }
  .tab.active .tab-count { background: rgba(255,255,255,.25); color: #fff; } 
  .tab:not(.active) .tab-count { background: var(--gray-200); color: var(--text-secondary); }

  .toast { 
    position: fixed; 
    bottom: 1.25rem; 
    right: 1.25rem; 
    z-index: 9999; 
    padding: .75rem 1.1rem; 
    border-radius: var(--radius-lg); 
    display: flex; 
    align-items: center; 
    gap: .6rem; 
    font-size: .8125rem; 
    font-weight: 600; 
    box-shadow: var(--shadow-lg); 
    animation: fadeUp .25s ease; 
    max-width: 380px; 
  }
  .toast-success { background: #16A34A; color: #fff; } 
  .toast-error { background: var(--red); color: #fff; }
  .toast-close { opacity: .8; cursor: pointer; font-size: 1.1rem; line-height: 1; border: none; background: none; color: inherit; margin-left: .3rem; }

  .overlay { 
    position: fixed; 
    inset: 0; 
    background: rgba(0,0,0,.6); 
    backdrop-filter: blur(4px); 
    display: flex; 
    align-items: center; 
    justify-content: center; 
    z-index: 9000; 
    padding: 1rem; 
    animation: fadeIn .2s ease; 
  }
  .modal { 
    background: var(--bg-card); 
    border-radius: var(--radius-xl); 
    max-width: 600px; 
    width: 100%; 
    padding: 1.75rem; 
    box-shadow: var(--shadow-lg); 
    animation: modalIn .2s ease; 
    max-height: 95vh; 
    overflow-y: auto; 
    border: 1px solid var(--border-color);
    transition: background 0.3s ease, border-color 0.3s ease;
  }
  .modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 1.25rem;
    padding-bottom: 0.75rem;
    border-bottom: 1px solid var(--border-color);
  }
  .modal-header h3 {
    font-size: 1.05rem;
    font-weight: 700;
    color: var(--text-primary);
    display: flex;
    align-items: center;
    gap: .6rem;
  }
  .modal-header .btn-close {
    background: none;
    border: none;
    font-size: 1.3rem;
    color: var(--text-secondary);
    cursor: pointer;
    padding: 0.25rem;
    transition: color 0.2s;
  }
  .modal-header .btn-close:hover { color: var(--red); }

  .upload-zone { 
    border: 2px dashed var(--gray-300); 
    border-radius: var(--radius-lg); 
    padding: 1.5rem; 
    text-align: center; 
    cursor: pointer; 
    transition: all .15s; 
    background: var(--gray-50); 
  }
  .upload-zone:hover, .upload-zone.drag { border-color: var(--red); background: var(--red-light); }
  .upload-zone.has-file { border-style: solid; border-color: #16A34A; background: #F0FDF4; }
  [data-theme="dark"] .upload-zone.has-file { background: #0D2818; border-color: #16A34A; }
  .upload-zone-icon { font-size: 1.75rem; margin-bottom: .5rem; color: var(--gray-400); }
  .upload-zone-label { font-size: .8125rem; font-weight: 600; color: var(--text-primary); }
  .upload-zone.has-file .upload-zone-icon { color: #16A34A; } 
  .upload-zone.has-file .upload-zone-label { color: #16A34A; }
  .upload-zone-req { font-size: .72rem; color: var(--red); margin-top: .35rem; font-weight: 600; }
  .upload-zone-optional { font-size: .72rem; color: var(--gray-400); margin-top: .35rem; }

  .proto { 
    background: var(--red-light); 
    color: var(--red-darker); 
    padding: .3rem .65rem; 
    border-radius: var(--radius-sm); 
    font-family: 'DM Mono', monospace; 
    font-size: .72rem; 
    font-weight: 500; 
    border: 1px solid var(--red-mid); 
    white-space: nowrap; 
  }
  [data-theme="dark"] .proto { color: #FCA5A5; border-color: #4A1A1A; }

  .section-head { 
    display: flex; 
    align-items: center; 
    justify-content: space-between; 
    padding: 1rem 1.25rem; 
    border-bottom: 1px solid var(--border-color); 
    background: var(--gray-50); 
  }
  .section-title { 
    font-size: .9375rem; 
    font-weight: 700; 
    color: var(--text-primary); 
    display: flex; 
    align-items: center; 
    gap: .5rem; 
  }
  .section-sub { font-size: .75rem; color: var(--text-secondary); margin-top: .1rem; }

  .search-bar {
    display: flex;
    gap: 0.5rem;
    padding: 0.75rem 1.25rem;
    background: var(--gray-50);
    border-bottom: 1px solid var(--border-color);
    flex-wrap: wrap;
  }
  .search-bar .search-input-wrap {
    position: relative;
    flex: 1;
    min-width: 200px;
  }
  .search-bar .search-input-wrap i {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-secondary);
    font-size: .9rem;
  }
  .search-bar .search-input-wrap input {
    padding-left: 36px;
    border-radius: 50px;
    height: 40px;
    background: var(--bg-card);
  }
  .search-bar .search-filters {
    display: flex;
    gap: 0.3rem;
    flex-wrap: wrap;
    align-items: center;
  }
  .search-bar .search-filters .btn-filter {
    border-radius: 50px;
    padding: 0.35rem 1rem;
    font-size: .75rem;
    font-weight: 600;
    background: var(--bg-card);
    border: 2px solid var(--border-color);
    color: var(--text-secondary);
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
  }
  .search-bar .search-filters .btn-filter:hover {
    border-color: var(--red);
    color: var(--red);
    background: var(--red-light);
  }
  .search-bar .search-filters .btn-filter.active {
    border-color: var(--red);
    color: var(--red);
    background: var(--red-light);
  }

  .filter-bar { background: var(--gray-50); border-bottom: 1px solid var(--border-color); padding: 1rem 1.25rem; }
  .filter-grid { display: flex; flex-wrap: wrap; gap: .625rem; align-items: flex-end; }
  .filter-field { min-width: 110px; flex: 1; } 
  .filter-field-wide { min-width: 180px; flex: 2; }

  .empty { text-align: center; padding: 3.5rem 1rem; color: var(--gray-400); }
  .empty-icon { font-size: 2.5rem; margin-bottom: .75rem; opacity: .4; }

<body>
<div id="app">
  <div id="loadingScreen" style="display:flex;align-items:center;justify-content:center;height:100vh;flex-direction:column;gap:12px">
    <div class="spinner spinner-red" style="width:32px;height:32px;border-width:3px"></div>
    <p style="color:var(--gray-400);font-size:.875rem;font-weight:500">Carregando...</p>
  </div>
</div>

<script>
// ========== UTILITÁRIOS ==========
function escaparHTML(str) {
  if (!str) return '';
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function formatarDataBR(dataISO) {
  if (!dataISO) return '—';
  const data = new Date(dataISO);
  if (isNaN(data.getTime())) return '—';
  return data.toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
}

function formatarDataSimples(dataISO) {
  if (!dataISO) return '—';
  const data = new Date(dataISO);
  if (isNaN(data.getTime())) return '—';
  return data.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric' });
}

// ===== OBTER INÍCIO E FIM DA SEMANA =====
function getSemanaAtual() {
  const hoje = new Date();
  const dia = hoje.getDay(); // 0 = Domingo, 1 = Segunda, ...
  const diff = hoje.getDate() - dia + (dia === 0 ? -6 : 1); // Ajusta para Segunda-feira
  const inicioSemana = new Date(hoje);
  inicioSemana.setDate(diff);
  inicioSemana.setHours(0, 0, 0, 0);
  
  const fimSemana = new Date(inicioSemana);
  fimSemana.setDate(inicioSemana.getDate() + 6);
  fimSemana.setHours(23, 59, 59, 999);
  
  return {
    inicio: inicioSemana.toISOString().slice(0, 10),
    fim: fimSemana.toISOString().slice(0, 10)
  };
}

function showToast(message, type) {
  const existing = document.querySelector('.toast');
  if (existing) existing.remove();
  const toast = document.createElement('div');
  toast.className = `toast toast-${type || 'success'}`;
  toast.innerHTML = `<i class="fas ${type==='success'?'fa-circle-check':'fa-circle-exclamation'}"></i><span style="flex:1">${escaparHTML(message)}</span><button class="toast-close">&times;</button>`;
  document.body.appendChild(toast);
  toast.querySelector('.toast-close').addEventListener('click', () => toast.remove());
  setTimeout(() => { if (toast.parentNode) toast.remove(); }, 4000);
}

function showModalConfirm(title, message, onConfirm, confirmText, confirmVariant) {
  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.innerHTML = `
    <div class="modal" style="max-width:380px">
      <div style="width:48px;height:48px;background:var(--red-light);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto .875rem;color:var(--red);font-size:1.2rem"><i class="fas fa-triangle-exclamation"></i></div>
      <div class="modal-header" style="border-bottom:none;padding-bottom:0;margin-bottom:0.5rem;">
        <h3 style="font-size:1.05rem;">${escaparHTML(title)}</h3>
        <button class="btn-close" onclick="this.closest('.overlay').remove()">&times;</button>
      </div>
      <div style="text-align:center;font-size:.8125rem;color:var(--text-secondary);margin-bottom:1.25rem;line-height:1.6">${message}</div>
      <div style="display:flex;gap:.5rem">
        <button id="modalCancelBtn" class="btn btn-ghost" style="flex:1;justify-content:center">Cancelar</button>
        <button id="modalConfirmBtn" class="btn ${confirmVariant==='success'?'btn-green':'btn-primary'}" style="flex:1;justify-content:center">${confirmText||'Confirmar'}</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  const close = () => overlay.remove();
  document.getElementById('modalCancelBtn').addEventListener('click', close);
  document.getElementById('modalConfirmBtn').addEventListener('click', () => { if (onConfirm) onConfirm(); close(); });
  overlay.addEventListener('click', (e) => { if (e.target === overlay) close(); });
}

function showModalDinamico(conteudoHTML, maxWidth = '560px') {
  closeModalDinamico();
  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.id = 'dinamicoOverlay';
  overlay.innerHTML = `<div class="modal" style="max-width:${maxWidth}">${conteudoHTML}</div>`;
  document.body.appendChild(overlay);
  overlay.addEventListener('click', (e) => { if (e.target === overlay) closeModalDinamico(); });
  return overlay;
}

function closeModalDinamico() {
  const overlay = document.getElementById('dinamicoOverlay');
  if (overlay) overlay.remove();
}

// ========== LOADING OVERLAY ==========
function mostrarLoadingOverlay(mensagem, subMensagem = '') {
  removerLoadingOverlay();
  const div = document.createElement('div');
  div.id = 'loadingOpOverlay';
  div.className = 'loading-overlay';
  div.innerHTML = `
    <div class="loading-box">
      <div class="spinner spinner-red"></div>
      <div class="loading-text">${escaparHTML(mensagem)}</div>
      ${subMensagem ? `<div class="loading-sub">${escaparHTML(subMensagem)}</div>` : ''}
    </div>
  `;
  document.body.appendChild(div);
}

function removerLoadingOverlay() {
  document.getElementById('loadingOpOverlay')?.remove();
}

// ========== COPIAR LINK ==========
function copiarLink(link, mensagem) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(link).then(() => {
      showToast(mensagem || 'Link copiado para a area de transferencia!', 'success');
    }).catch(() => {
      copiarLinkFallback(link);
    });
  } else {
    copiarLinkFallback(link);
  }
}

function copiarLinkFallback(link) {
  const textarea = document.createElement('textarea');
  textarea.value = link;
  textarea.style.position = 'fixed';
  textarea.style.opacity = '0';
  textarea.style.pointerEvents = 'none';
  document.body.appendChild(textarea);
  textarea.select();
  try {
    document.execCommand('copy');
    showToast('Link copiado para a area de transferencia!', 'success');
  } catch (e) {
    showToast(`Link: ${link}`, 'success');
  }
  document.body.removeChild(textarea);
}

// ========== DROPDOWN ==========
function toggleDropdown() {
  const menu = document.getElementById('dropdownMenu');
  if (menu) {
    menu.classList.toggle('show');
  }
}

document.addEventListener('click', function(e) {
  const dropdown = document.querySelector('.dropdown');
  if (dropdown && !dropdown.contains(e.target)) {
    const menu = document.getElementById('dropdownMenu');
    if (menu) menu.classList.remove('show');
  }
});

// ========== ABRIR MODAL COPIAR LINK ==========

      <button class="btn-close" onclick="closeModalDinamico()">&times;</button>
    </div>
    <div style="display:flex;align-items:center;gap:.75rem;margin-bottom:1rem;padding:.75rem;background:var(--gray-50);border-radius:var(--radius);border:1px solid var(--border-color);">
      <div style="width:36px;height:36px;background:#DBEAFE;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#1E40AF;font-size:.9rem;flex-shrink:0;"><i class="fas fa-file-pdf"></i></div>

    </div>
    <div style="background:var(--gray-50);border-radius:var(--radius);padding:.75rem 1rem;margin-bottom:1rem;word-break:break-all;font-size:.75rem;color:var(--text-primary);font-family:monospace;border:1px solid var(--border-color);">
      ${escaparHTML(link)}
    </div>
    <div style="display:flex;gap:.5rem">
      <button onclick="closeModalDinamico()" class="btn btn-ghost" style="flex:1;justify-content:center">Fechar</button>
      <button onclick="copiarLink('${link}', 'Link copiado para a area de transferencia!'); closeModalDinamico();" class="btn btn-blue" style="flex:1;justify-content:center">
        <i class="fas fa-copy"></i> Copiar Link

// ========== TEMA ==========
function toggleTheme() {
  const html = document.documentElement;
  const current = html.getAttribute('data-theme');
  const newTheme = current === 'dark' ? 'light' : 'dark';
  html.setAttribute('data-theme', newTheme);
  localStorage.setItem('theme', newTheme);
  
  const icon = document.getElementById('themeIcon');
  if (icon) {
    icon.className = newTheme === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
  }
}

function initTheme() {
  const saved = localStorage.getItem('theme');
  const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  const theme = saved || (prefersDark ? 'dark' : 'light');
  document.documentElement.setAttribute('data-theme', theme);
  
  setTimeout(() => {
    const icon = document.getElementById('themeIcon');
    if (icon) {
      icon.className = theme === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
    }
  }, 100);
}

// ========== ALTERAR SENHA ==========
function abrirModalAlterarSenha(tecnicoId, tecnicoNome) {
    const conteudo = `
        <div class="modal-header">
            <h3><i class="fas fa-key" style="color:#F59E0B;"></i> Alterar Senha</h3>
            <button class="btn-close" onclick="closeModalDinamico()">&times;</button>
        </div>
        <div style="display:flex;align-items:center;gap:.75rem;margin-bottom:1.25rem;padding:.75rem;background:var(--gray-50);border-radius:var(--radius);border:1px solid var(--border-color);">
            <div style="width:36px;height:36px;background:#FEF3C7;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#D97706;font-size:.9rem;flex-shrink:0;"><i class="fas fa-user"></i></div>
            <div>
                <div style="font-weight:600;font-size:.85rem;color:var(--text-primary);">${escaparHTML(tecnicoNome)}</div>
                <div style="font-size:.7rem;color:var(--text-secondary);">Digite a nova senha</div>
            </div>
        </div>
        <div class="login-field">
            <label>Nova Senha</label>
            <input id="novaSenhaInput" type="text" placeholder="Digite a nova senha" style="width:100%;padding:10px;border:2px solid var(--border-color);border-radius:8px;background:var(--bg-card);color:var(--text-primary);">
            <div style="font-size:.7rem;color:var(--text-secondary);margin-top:4px;">
                <i class="fas fa-info-circle"></i> Minimo 4 caracteres
            </div>
        </div>
        <div id="senhaError" class="field-error-msg" style="display:none;margin-top:4px;">Senha deve ter pelo menos 4 caracteres</div>
        <div style="display:flex;gap:.5rem;margin-top:.5rem">
            <button onclick="closeModalDinamico()" class="btn btn-ghost" style="flex:1;justify-content:center">Cancelar</button>
            <button onclick="confirmarAlterarSenha('${tecnicoId}', '${escaparHTML(tecnicoNome)}')" class="btn btn-edit-senha" style="flex:2;justify-content:center">
                <i class="fas fa-save"></i> Salvar Senha
            </button>
        </div>
    `;
    showModalDinamico(conteudo, '420px');
}

async function confirmarAlterarSenha(tecnicoId, tecnicoNome) {
    const novaSenha = document.getElementById('novaSenhaInput').value.trim();
    const errorDiv = document.getElementById('senhaError');
    
    if (!novaSenha || novaSenha.length < 4) {
        errorDiv.style.display = 'block';
        return;
    }
    errorDiv.style.display = 'none';
    
    try {
        const response = await authFetch(`/api/tecnicos/${tecnicoId}/senha`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ senha: novaSenha })
        });
        const data = await response.json();
        
        if (data.sucesso) {
            showToast(`Senha do tecnico ${tecnicoNome} alterada para: ${novaSenha}`, 'success');
            closeModalDinamico();
            await carregarDados();
            renderizarConteudoPrincipal();
        } else {
            showToast(data.erro || 'Erro ao alterar senha', 'error');
        }
    } catch (error) {
        console.error('Erro ao alterar senha:', error);
        showToast('Erro de conexao', 'error');
    }
}

// ========== FINALIZAR OS ==========
async function finalizarOSAdmin(contratoId, atendimentoId) {
    if (!atendimentoId) {
        showToast('ID do atendimento nao disponivel', 'error');
        return;
    }
    
    if (!confirm(`Deseja realmente finalizar o atendimento ${atendimentoId} no RadiusNet?`)) {
        return;
    }
    
    const btn = document.querySelector(`.btn-finalizar-os[data-contrato="${contratoId}"]`);
    if (btn) {
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner-small"></span>';
    }
    
    try {
        const response = await authFetch('/api/radiusnet/finalizar-atendimento', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                contrato_id: contratoId,
                id_atendimento: atendimentoId,
                tecnico_id: 'admin',
                descricao: 'Finalizado pelo administrador via painel',
                adicionar_ocorrencia: true,
                id_resolucao: 1
            })
        });
        
        const data = await response.json();
        if (data.sucesso) {
            showToast(`OS ${atendimentoId} finalizada com sucesso!`, 'success');
            await carregarDados();
            renderizarConteudoPrincipal();
        } else {
            showToast(data.erro || 'Erro ao finalizar OS', 'error');
            if (btn) {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-clipboard-check"></i> Finalizar OS';
            }
        }
    } catch (error) {
        console.error('Erro ao finalizar OS:', error);
        showToast('Erro de conexao ao finalizar OS', 'error');
        if (btn) {
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-clipboard-check"></i> Finalizar OS';
        }
    }
}

// ========== BUSCAR DADOS COMPLETOS DA OS ==========
async function buscarDadosCompletosOS(idOs) {
    if (!idOs) {
        showToast('ID da OS nao informado', 'error');
        return null;
    }
    
    const statusEl = document.getElementById('radiusnetOsStatus');
    const clienteInput = document.getElementById('clienteNomeOs');
    
    if (statusEl) {
        statusEl.innerHTML = '<div class="os-loading-indicator"><span class="spinner-small"></span> Buscando dados do cliente...</div>';
    }
    
    if (clienteInput) {
        clienteInput.value = 'Buscando cliente...';
        clienteInput.className = 'buscando';
    }
    
    try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 15000);
        
        const res = await authFetch(`/api/radiusnet/os-completa-com-descricao/${idOs}`, {
            signal: controller.signal
        });
        clearTimeout(timeoutId);
        
        const data = await res.json();
        
        if (data.sucesso && data.dados_cliente) {
            const dados = data.dados_cliente;
            let nomeCliente = dados.cliente_nome || dados.nome || 'Cliente nao informado';
            
            if (nomeCliente === 'Cliente nao informado' && dados.id_cliente) {
                try {
                    const clienteRes = await authFetch(`/api/radiusnet/cliente-nome/${idOs}`);
                    const clienteData = await clienteRes.json();
                    if (clienteData.sucesso && clienteData.nome_cliente && clienteData.nome_cliente !== 'Cliente nao informado') {
                        nomeCliente = clienteData.nome_cliente;
                    }
                } catch (e) {
                    console.warn('Erro ao buscar nome do cliente via fallback:', e);
                }
            }
            
            if (clienteInput) {
                clienteInput.value = nomeCliente;
                if (nomeCliente !== 'Cliente nao informado') {
                    clienteInput.style.background = '#F0FDF4';
                    clienteInput.style.borderColor = '#16A34A';
                    clienteInput.style.color = '#166534';
                    clienteInput.className = 'form-input preenchido';
                } else {
                    clienteInput.style.background = '#FEF2F2';
                    clienteInput.style.borderColor = '#DC2626';
                    clienteInput.style.color = '#991B1B';
                    clienteInput.className = 'form-input';
                }
            }
            
            const nomeOsInput = document.getElementById('nomeOsRadius');
            if (nomeOsInput) {
                nomeOsInput.value = `OS ${idOs} - ${nomeCliente}`;
            }
            
            const docNome = document.getElementById('docNome');
            if (docNome && !docNome.value) {
                docNome.value = `OS ${idOs} - ${nomeCliente}`;
            }
            
            if (statusEl) {
                if (nomeCliente !== 'Cliente nao informado') {
                    statusEl.innerHTML = `<i class="fas fa-check-circle" style="color:#16A34A"></i> Cliente: ${nomeCliente}`;
                    showToast(`Cliente encontrado: ${nomeCliente}`, 'success');
                } else {
                    statusEl.innerHTML = `<i class="fas fa-exclamation-circle" style="color:#DC2626"></i> Cliente nao encontrado para OS ${idOs}`;
                    showToast(`Cliente nao encontrado para OS ${idOs}`, 'error');
                }
            }
            
            console.log('Dados completos da OS:', dados);
            return dados;
        } else {
            if (statusEl) {
                statusEl.innerHTML = `<i class="fas fa-exclamation-circle" style="color:#DC2626"></i> ${data.erro || 'Cliente nao encontrado'}`;
            }
            if (clienteInput) {
                clienteInput.value = 'Cliente nao informado';
                clienteInput.className = 'form-input';
            }
            showToast(data.erro || 'Erro ao buscar dados da OS', 'error');
            return null;
        }
    } catch (e) {
        console.error('Erro ao buscar dados completos da OS:', e);
        if (e.name === 'AbortError') {
            if (statusEl) {
                statusEl.innerHTML = `<i class="fas fa-exclamation-circle" style="color:#DC2626"></i> Timeout - O servidor demorou muito para responder`;
            }
            showToast('Timeout ao buscar OS. Tente novamente.', 'error');
        } else {
            if (statusEl) {
                statusEl.innerHTML = `<i class="fas fa-exclamation-circle" style="color:#DC2626"></i> Erro de conexao: ${e.message}`;
            }
            showToast('Erro de conexao ao buscar OS', 'error');
        }
        if (clienteInput) {
            clienteInput.value = 'Erro ao buscar';
            clienteInput.className = 'form-input';
        }
        return null;
    }
}

// ========== BUSCAR DADOS DO CLIENTE PARA INSTALAÇÃO ==========

                    clienteInput.style.color = '#991B1B';

                    statusEl.innerHTML = `<i class="fas fa-exclamation-circle" style="color:#DC2626"></i> Cliente não encontrado para o ID ${idClientePlano}`;
                    statusEl.style.color = '#DC2626';
                    showToast(`Cliente não encontrado para ID ${idClientePlano}`, 'error');
                }
            }
            
            // Atualiza nome do documento automaticamente
            const docNome = document.getElementById('docNome');
            if (docNome && !docNome.value && nomeCliente !== 'Cliente nao informado') {
                docNome.value = `${nomeCliente} - Instalacao`;
            }
            
            // Salva no estado
            state.radiusnetClienteNome = nomeCliente;
            state.radiusnetIdClientePlano = idClientePlano;
            
            // Se encontrou o cliente, tenta baixar o termo automaticamente
            if (nomeCliente !== 'Cliente nao informado') {
                await baixarTermoInstalacao(idClientePlano);
            }
            
            return data;
            
        } else {
            // Erro na resposta
            if (statusEl) {
                statusEl.innerHTML = `<i class="fas fa-exclamation-circle" style="color:#DC2626"></i> ${data.erro || 'Cliente não encontrado'}`;
                statusEl.style.color = '#DC2626';
            }
            if (clienteInput) {
                clienteInput.value = 'Cliente não encontrado';
                clienteInput.style.background = '#FEF2F2';
                clienteInput.style.borderColor = '#DC2626';
                clienteInput.style.color = '#991B1B';
                clienteInput.className = 'form-input';
            }
            showToast(data.erro || 'Cliente não encontrado', 'error');
            return null;
        }
        
    } catch (e) {
        console.error('Erro ao buscar dados do cliente:', e);
        if (e.name === 'AbortError') {
            if (statusEl) {
                statusEl.innerHTML = `<i class="fas fa-exclamation-circle" style="color:#DC2626"></i> Timeout - O servidor demorou muito para responder`;
                statusEl.style.color = '#DC2626';
            }
            showToast('Timeout ao buscar cliente. Tente novamente.', 'error');
        } else {
            if (statusEl) {
                statusEl.innerHTML = `<i class="fas fa-exclamation-circle" style="color:#DC2626"></i> Erro de conexão: ${e.message}`;
                statusEl.style.color = '#DC2626';
            }
            showToast('Erro de conexão ao buscar cliente', 'error');
        }
        if (clienteInput) {
            clienteInput.value = 'Erro ao buscar';
            clienteInput.style.background = '#FEF2F2';
            clienteInput.style.borderColor = '#DC2626';
            clienteInput.style.color = '#991B1B';
            clienteInput.className = 'form-input';
        }
        return null;
        
    } finally {
        // Restaura botão
        if (buscarBtn) {
            buscarBtn.disabled = false;
            buscarBtn.innerHTML = '<i class="fas fa-search"></i> Buscar';
        }
    }
}

// ========== BAIXAR TERMO DE INSTALAÇÃO ==========
async function baixarTermoInstalacao(idClientePlano) {
    const statusEl = document.getElementById('radiusnetStatus');
    const zonePdf = document.getElementById('zonePdf');
    
    if (statusEl) {
        statusEl.innerHTML = '<div class="os-loading-indicator"><span class="spinner-small"></span> Baixando termo de adesão...</div>';
        statusEl.style.color = 'var(--text-secondary)';
    }
    
    try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 30000);
        
        const pdfRes = await authFetch(`/api/radiusnet/termo-pdf/${idClientePlano}?tipo=0`, {
            signal: controller.signal
        });
        clearTimeout(timeoutId);
        
        if (pdfRes.ok) {
            const blob = await pdfRes.blob();
            const file = new File([blob], `termo_${idClientePlano}.pdf`, { type: 'application/pdf' });
            state.selectedPdf = file;
            atualizarZona('zonePdf', file);
            
            if (statusEl) {
                statusEl.innerHTML = `<i class="fas fa-check-circle" style="color:#16A34A"></i> Termo baixado com sucesso! (${(file.size / 1024).toFixed(1)} KB)`;
                statusEl.style.color = '#16A34A';
                showToast('Termo baixado com sucesso!', 'success');
            }
            
            return true;
        } else {
            let erroMsg = 'Erro ao baixar termo';
            try {
                const data = await pdfRes.json();
                erroMsg = data.erro || erroMsg;
            } catch (_) {}
            
            if (statusEl) {
                statusEl.innerHTML = `<i class="fas fa-exclamation-circle" style="color:#DC2626"></i> ${erroMsg}`;
                statusEl.style.color = '#DC2626';
            }
            showToast(erroMsg, 'error');
            return false;
        }
        
    } catch (e) {
        console.error('Erro ao baixar termo:', e);
        if (e.name === 'AbortError') {
            if (statusEl) {
                statusEl.innerHTML = `<i class="fas fa-exclamation-circle" style="color:#DC2626"></i> Timeout ao baixar o termo. Tente novamente.`;
                statusEl.style.color = '#DC2626';
            }
            showToast('Timeout ao baixar termo (mais de 30s). Verifique o servidor.', 'error');
        } else {
            if (statusEl) {
                statusEl.innerHTML = `<i class="fas fa-exclamation-circle" style="color:#DC2626"></i> Erro ao baixar termo: ${e.message}`;
                statusEl.style.color = '#DC2626';
            }
            showToast('Erro ao baixar termo', 'error');
        }
        return false;
    }
}

// ========== API ==========
async function authFetch(url, options = {}) {
  const token = localStorage.getItem('tecnicoToken') || sessionStorage.getItem('tecnicoToken');
  
  const headers = {
    ...options.headers,
  };
  
  if (!(options.body instanceof FormData)) {
    headers['Content-Type'] = 'application/json';
  }
  
  if (token) {
    headers['X-Tecnico-Token'] = token;
  }
  
  const newOptions = {
    ...options,
    headers: headers
  };
  
  if (options.body instanceof FormData) {
    delete newOptions.headers['Content-Type'];
  }
  
  try {
    const res = await fetch(url, newOptions);
    if (res.status === 401) {
      const tokenStorage = localStorage.getItem('tecnicoToken');
      if (tokenStorage) {
        const retryHeaders = { ...newOptions.headers, 'X-Tecnico-Token': tokenStorage };
        if (options.body instanceof FormData) {
          delete retryHeaders['Content-Type'];
        }
        const retryRes = await fetch(url, {
          ...newOptions,
          headers: retryHeaders
        });
        if (retryRes.ok) return retryRes;
      }
      realizarLogout();
      throw new Error('Nao autenticado');
    }
    return res;
  } catch (e) {
    if (e.message !== 'Nao autenticado') showToast('Erro de conexao', 'error');
    throw e;
  }
}

// ===== CARREGAR DADOS =====
async function carregarDados() {
  state.loading = true;
  try {
    try {
      const cRes = await authFetch('/api/contratos');
      const cData = await cRes.json();
      if (Array.isArray(cData)) {
        state.contratos = cData;
        const hoje = new Date().toISOString().slice(0, 10);
        state.stats = {
          instalacoes: cData.filter(c => c.tipo_instalacao === 'instalacao').length,
          hoje: cData.filter(c => c.data_hora && c.data_hora.startsWith(hoje)).length,
          mudancas: cData.filter(c => c.tipo_instalacao === 'mudanca_endereco').length,
          mudancas_assinante: cData.filter(c => c.tipo_instalacao === 'mudanca_assinante').length,
          os: cData.filter(c => c.tipo_instalacao === 'ordem_servico').length
        };
      }
    } catch(e) { console.error(e); showToast('Erro ao carregar contratos', 'error'); }

    try {
      const tRes = await authFetch('/api/tecnicos');
      const tData = await tRes.json();
      if (Array.isArray(tData)) state.tecnicos = tData;
    } catch(e) { console.error(e); showToast('Erro ao carregar tecnicos', 'error'); }

    try {
      const tmRes = await authFetch('/api/templates?nocache=' + Date.now());
      const tmData = await tmRes.json();
      if (Array.isArray(tmData)) {
        state.templates = tmData.map(t => ({ 
          ...t, 
          has_os: !!t.os_pdf_path,
          has_retirada: !!t.has_retirada,
          data_agendada: t.data_agendada || ''
        }));
        const map = {};
        tmData.forEach(t => { map[t.id] = t.nome; });
        state.templateMap = map;
      }
    } catch(e) { 
      console.error('Erro ao carregar modelos:', e); 
      showToast('Erro ao carregar modelos', 'error'); 
    }
  } finally {
    state.loading = false;
    if (state.logged) renderizarConteudoPrincipal();
  }
}

async function verificarSessao() {
  try {
    const res = await fetch('/api/admin/check-auth');
    if (res.ok) {
      const data = await res.json();
      if (data.autenticado) { 
        state.logged = true; 
        await carregarDados(); 
        // ===== APOS CARREGAR DADOS, APLICA FILTRO DA SEMANA =====
        const semana = getSemanaAtual();
        state.filters.inicio = semana.inicio;
        state.filters.fim = semana.fim;
        state.filters.quickFilter = 'semana';
        renderizar(); 
        return;
      }
    }
    state.logged = false; renderizar();
  } catch(e) { state.logged = false; renderizar(); }
}

async function realizarLogin() {
  const usuario = document.getElementById('loginUser')?.value?.trim();
  const senha = document.getElementById('loginPass')?.value;
  if (!usuario || !senha) {
    const el = document.getElementById('loginError');
    if (el) { el.style.display = 'block'; setTimeout(() => { el.style.display = 'none'; }, 3000); }
    return;
  }
  const btn = document.getElementById('loginBtn');
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Entrando...';
  try {
    const res = await fetch('/api/admin/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: usuario, password: senha })
    });
    const data = await res.json();
    if (res.ok && data.sucesso) {
      state.logged = true; 
      await carregarDados();
      // ===== APOS LOGIN, APLICA FILTRO DA SEMANA =====
      const semana = getSemanaAtual();
      state.filters.inicio = semana.inicio;
      state.filters.fim = semana.fim;
      state.filters.quickFilter = 'semana';
      renderizar();
    } else {
      const el = document.getElementById('loginError');
      if (el) { el.style.display = 'block'; setTimeout(() => { el.style.display = 'none'; }, 3000); }
    }
  } catch(e) { showToast('Erro de conexao', 'error'); }
  finally { if (btn) { btn.disabled = false; btn.innerHTML = '<i class="fas fa-arrow-right-to-bracket"></i> Entrar'; } }
}

async function realizarLogout() {
  try { await fetch('/api/admin/logout', { method: 'POST' }); } catch(e) {}
  state.logged = false; state.contratos = []; state.tecnicos = []; state.templates = [];
  renderizar();
}

function aplicarBuscaRapida(valor) {
  state.filters.busca = valor;
  preencherTabelaContratos(document.querySelector('.tabs')?.dataset?.tipoConfig || {});
}

function aplicarFiltroRapido(tipo) {
  document.querySelectorAll('.btn-filter').forEach(b => b.classList.remove('active'));
  const btn = document.querySelector(`.btn-filter[onclick*="${tipo}"]`);
  if (btn) btn.classList.add('active');
  
  state.filters.quickFilter = tipo;
  const agora = new Date();
  let inicio = '', fim = '';
  
  if (tipo === 'hoje') {
    inicio = agora.toISOString().slice(0, 10);
    fim = agora.toISOString().slice(0, 10);
  } else if (tipo === 'semana') {
    const semana = getSemanaAtual();
    inicio = semana.inicio;
    fim = semana.fim;
  } else if (tipo === 'mes') {
    const inicioMes = new Date(agora.getFullYear(), agora.getMonth(), 1);
    inicio = inicioMes.toISOString().slice(0, 10);
    fim = agora.toISOString().slice(0, 10);
  } else {
    state.filters.inicio = '';
    state.filters.fim = '';
    preencherTabelaContratos({});
    return;
  }
  
  state.filters.inicio = inicio;
  state.filters.fim = fim;
  document.getElementById('filtroInicio').value = inicio;
  document.getElementById('filtroFim').value = fim;
  preencherTabelaContratos({});
}

// ========== HANDLER DE CLICK DA TABELA ==========
function handleContratosTableClick(e) {
  const btn = e.target.closest('button');
  if (!btn) return;
  const id = btn.dataset.id;
  if (btn.classList.contains('ver-detalhes')) abrirDetalhesContrato(id);
  else if (btn.classList.contains('enviar-link')) abrirModalEnvioLink(id);
  else if (btn.classList.contains('enviar-pdf')) abrirModalMetodoEnvio(id, false);
  else if (btn.classList.contains('copiar-link')) abrirModalCopiarLink(id);
  else if (btn.classList.contains('finalizar-os')) {
    const atendimentoId = btn.dataset.atendimento;
    if (atendimentoId) {
      finalizarOSAdmin(id, atendimentoId);
    } else {
      showToast('ID do atendimento nao disponivel', 'error');
    }
  }
}

function preencherTabelaContratos(tipoConfig) {
  const tbody = document.getElementById('contratosTbody');
  if (!tbody) return;

  if (!tbody.dataset.listenerAttached) {
    tbody.addEventListener('click', handleContratosTableClick);
    tbody.dataset.listenerAttached = 'true';
  }

  const getStatusBadge = (status) => {
    switch(status) {
      case 'complete': return { badge: 'badge-green', icon: 'fa-check-circle', text: 'Assinado' };
      case 'pending': return { badge: 'badge-pending', icon: 'fa-clock', text: 'Pendente' };
      case 'complete_remote': return { badge: 'badge-remote', icon: 'fa-laptop', text: 'Assinado Remoto' };
      case 'completed_retirada': return { badge: 'badge-rose', icon: 'fa-box-open', text: 'Retirada' };
      case 'os_finalizada': return { badge: 'badge-purple', icon: 'fa-check-double', text: 'OS Finalizada' };
      default: return { badge: 'badge-red', icon: 'fa-question', text: status || '—' };
    }
  };

  const contratosFiltrados = state.contratos.filter(c => {
    if (state.filters.inicio || state.filters.fim) {
      const dataDoc = c.data_hora ? new Date(c.data_hora) : null;
      if (!dataDoc) return false;
      if (state.filters.inicio && dataDoc < new Date(state.filters.inicio + 'T00:00:00')) return false;
      if (state.filters.fim && dataDoc >= new Date(state.filters.fim + 'T24:00:00')) return false;
    }
    if (state.filters.tecnico && (c.tecnico_nome || '').toLowerCase() !== state.filters.tecnico.toLowerCase()) return false;
    if (state.filters.tipo && c.tipo_instalacao !== state.filters.tipo) return false;
    if (state.filters.busca) {
      const b = state.filters.busca.toLowerCase();
      const nomeDoc = state.templateMap[c.template_id] || '';
      const nomeCliente = (c.cliente_nome || '').toLowerCase();
      return (c.contrato_id || '').toLowerCase().includes(b) || nomeDoc.toLowerCase().includes(b) || nomeCliente.includes(b);
    }
    return true;
  });

  if (state.loading) {
    tbody.innerHTML = `<tr><td colspan="11"><div class="empty"><div class="spinner spinner-red" style="margin:0 auto .75rem;width:28px;height:28px;border-width:3px"></div><div class="empty-sub">Carregando...</div></div></td></tr>`;
    return;
  }

  if (contratosFiltrados.length === 0) {
    tbody.innerHTML = `<tr><td colspan="11"><div class="empty"><div class="empty-icon"><i class="fas fa-inbox"></i></div><div class="empty-title">Nenhum documento</div><div class="empty-sub">Ajuste os filtros ou aguarde</div></div></td></tr>`;
    return;
  }

  let html = '';
  contratosFiltrados.forEach(c => {
    const tc = tipoConfig[c.tipo_instalacao] || { badge:'badge-red', icon:'fa-file', text:c.tipo_instalacao||'—' };
    const nomeCliente = c.cliente_nome || '—';
    const si = getStatusBadge(c.signature_status);
    const isPending = c.signature_status === 'pending';
    const isRetirada = c.tipo_instalacao === 'retirada_sistema';
    const isOSFinalizada = c.signature_status === 'os_finalizada';
    const hasAtendimento = c.radiusnet_id_atendimento && c.radiusnet_id_atendimento !== '';
    const isOS = c.tipo_instalacao === 'ordem_servico';
    const isComplete = c.signature_status === 'complete' || c.signature_status === 'complete_remote';
    
    let botoesAcao = `
      <button class="btn btn-outline btn-sm btn-icon ver-detalhes" data-id="${c.id}" title="Ver detalhes"><i class="fas fa-eye"></i></button>`;
    
    if (!isPending && !isRetirada && !isOSFinalizada) {
      botoesAcao += `
        <a href="/api/pdf/${c.id}" target="_blank" class="btn btn-green btn-sm btn-icon" title="Download PDF"><i class="fas fa-download"></i></a>`;
    }
    
    if (c.txt_content) {
      botoesAcao += `
        <button class="btn btn-sm btn-icon" style="background:#DBEAFE;color:#1E40AF;border:none" onclick="baixarTxt('${c.id}')" title="Baixar TXT"><i class="fas fa-file-lines"></i></button>`;
    }
    
    if (isPending) {
      botoesAcao += `
        <button class="btn btn-blue btn-sm btn-icon enviar-link" data-id="${c.id}" title="Enviar Link de Assinatura"><i class="fas fa-link"></i></button>`;
    } else if (!isRetirada && !isOSFinalizada) {
      botoesAcao += `
        <button class="btn btn-primary btn-sm btn-icon enviar-pdf" data-id="${c.id}" title="Enviar PDF"><i class="fas fa-envelope"></i></button>`;
    }
    
    if (isComplete || isOSFinalizada) {
      botoesAcao += `
        <button class="btn btn-copy-link btn-sm btn-icon copiar-link" data-id="${c.id}" title="Copiar link do PDF"><i class="fas fa-copy"></i></button>`;
    }
    
    if (isOS && hasAtendimento && !isOSFinalizada) {
      botoesAcao += `
        <button class="btn-finalizar-os" data-id="${c.id}" data-atendimento="${c.radiusnet_id_atendimento}" title="Finalizar OS no RadiusNet">
          <i class="fas fa-clipboard-check"></i> Finalizar OS
        </button>`;
    } else if (isOS && hasAtendimento && isOSFinalizada) {
      botoesAcao += `
        <span class="btn-finalizar-os-ok"><i class="fas fa-check-circle"></i> OS OK</span>`;
    }

    html += `<tr>
      <td><span class="proto">${escaparHTML(c.contrato_id||'—')}</span></td>
      <td><span class="badge ${tc.badge}"><i class="fas ${tc.icon}"></i> ${tc.text}</span></td>
      <td style="font-weight:600;color:var(--text-primary)">${escaparHTML(nomeCliente)}</td>
      <td>${c.campo_cliente ? `<span class="badge badge-blue">${escaparHTML(c.campo_cliente)}</span>` : '<span style="color:var(--gray-400)">—</span>'}</td>
      <td>${c.campo_ctop ? `<span class="badge badge-amber">${escaparHTML(c.campo_ctop)}</span>` : '<span style="color:var(--gray-400)">—</span>'}</td>
      <td>${c.campo_db ? `<span class="badge badge-teal">${escaparHTML(c.campo_db)}</span>` : '<span style="color:var(--gray-400)">—</span>'}</td>
      <td style="max-width:140px">${c.os_descricao ? `<span style="display:block;overflow:hidden;text-overflow:ellipsis;max-width:140px;color:var(--text-secondary);font-size:.78rem" title="${escaparHTML(c.os_descricao)}">${escaparHTML(c.os_descricao)}</span>` : '<span style="color:var(--gray-400)">—</span>'}</td>
      <td style="color:var(--text-primary);font-weight:500">${escaparHTML(c.tecnico_nome||'—')}</td>
      <td style="color:var(--text-secondary);font-size:.78rem" class="mono">${formatarDataBR(c.data_hora)}</td>
      <td><span class="badge ${si.badge}"><i class="fas ${si.icon}"></i> ${si.text}</span></td>
      <td><div class="acoes-horizontais">${botoesAcao}</div></td>
    </tr>`;
  });
  tbody.innerHTML = html;
}

// ========== ABA TEMPLATES ==========
function renderizarAbaTemplates(container, tipoConfig) {
  const card = document.createElement('div');
  card.className = 'card';
  
  // Contar quantos têm data_agendada
  const comData = state.templates.filter(t => t.data_agendada).length;
  const semData = state.templates.filter(t => !t.data_agendada).length;
  
  let html = `<div class="servicos-dia-header">
    <div class="info">
      <i class="fas fa-calendar-day"></i>
      <span><strong>Serviços Agendados</strong></span>
      <span style="font-size:.7rem;color:var(--text-secondary);">
        ${state.mostrarTodosTemplates ? '(exibindo todos)' : `(${comData} com data${semData > 0 ? `, ${semData} sem data` : ''})`}
      </span>
    </div>
    <div class="actions">
      <button class="btn-ver-todos ${state.mostrarTodosTemplates ? 'active' : ''}" onclick="toggleMostrarTodosTemplates()">
        <i class="fas ${state.mostrarTodosTemplates ? 'fa-calendar-day' : 'fa-list'}"></i>
        ${state.mostrarTodosTemplates ? ' Ver Agendados' : ' Ver Todos'}
      </button>
      <button class="btn btn-primary btn-sm" onclick="abrirModalTipoTemplate()">
        <i class="fas fa-plus"></i> Novo
      </button>
    </div>
  </div>`;

  if (state.templates.length === 0) {
    html += `<div class="empty">
      <div class="empty-icon"><i class="fas fa-folder-open"></i></div>
      <div class="empty-title">${state.mostrarTodosTemplates ? 'Nenhum modelo cadastrado' : 'Nenhum serviço agendado'}</div>
      <div class="empty-sub">${state.mostrarTodosTemplates ? 'Cadastre o primeiro modelo' : 'Aguarde novos serviços com data agendada'}</div>
    </div>`;
  } else {
    // Filtrar se não estiver mostrando todos
    let templatesParaExibir = state.templates;
    if (!state.mostrarTodosTemplates) {
      templatesParaExibir = state.templates.filter(t => t.data_agendada);
    }
    
    if (templatesParaExibir.length === 0) {
      html += `<div class="empty">
        <div class="empty-icon"><i class="fas fa-calendar-times"></i></div>
        <div class="empty-title">Nenhum serviço com data agendada</div>
        <div class="empty-sub">Cadastre serviços com data agendada para aparecerem aqui</div>
      </div>`;
    } else {
      templatesParaExibir.forEach(t => {
        const tc = tipoConfig[t.tipo] || { badge:'badge-red', icon:'fa-file', text:t.tipo };
        const dataCriacao = new Date(t.criado_em);
        const hoje = new Date();
        const isHoje = dataCriacao.toDateString() === hoje.toDateString();
        
        let statusClass = 'pendente';
        let statusText = 'Pendente';
        
        if (t.radiusnet_id_os) {
          const contratoAssociado = state.contratos.find(c => c.radiusnet_id_os === t.radiusnet_id_os);
          if (contratoAssociado && contratoAssociado.signature_status === 'os_finalizada') {
            statusClass = 'finalizado';
            statusText = 'Finalizado';
          } else {
            statusClass = 'pendente';
            statusText = 'Pendente';
          }
        } else {
          statusClass = 'pendente';
          statusText = 'Pendente';
        }
        
        const temMensagemExtra = t.mensagem_extra && t.mensagem_extra.trim() !== '';
        
        // ===== EXIBIR DATA AGENDADA =====
        let dataAgendada = '';
        let dataAgendadaClass = '';
        let dataAgendadaLabel = 'Sem data agendada';
        let dataAgendadaIcon = 'fa-calendar-day';
        
        if (t.data_agendada) {
          const dataAg = new Date(t.data_agendada);
          const hojeStr = new Date().toDateString();
          dataAgendada = formatarDataSimples(t.data_agendada);
          
          if (dataAg.toDateString() === hojeStr) {
            dataAgendadaClass = 'hoje';
            dataAgendadaLabel = '📅 HOJE';
            dataAgendadaIcon = 'fa-calendar-check';
          } else if (dataAg < new Date()) {
            dataAgendadaClass = 'passou';
            dataAgendadaLabel = `📅 ${dataAgendada} (atrasado)`;
            dataAgendadaIcon = 'fa-calendar-times';
          } else {
            const diffDias = Math.ceil((dataAg - new Date()) / (1000 * 60 * 60 * 24));
            dataAgendadaLabel = `📅 ${dataAgendada} (em ${diffDias} dia${diffDias > 1 ? 's' : ''})`;
            dataAgendadaIcon = 'fa-calendar-day';
          }
        }
        
        // ===== EXIBIR DATA DE CRIAÇÃO =====
        const dataCriacaoStr = formatarDataSimples(t.criado_em);
        const criadoEm = `Criado em: ${dataCriacaoStr}`;
        
        html += `
          <div class="servico-item">
            <div class="servico-icone ${t.tipo}">
              <i class="fas ${tc.icon}"></i>
            </div>
            <div class="servico-info">
              <div class="servico-nome">${escaparHTML(t.nome)}</div>
              <div class="servico-detalhes">
                <span class="badge ${tc.badge}">${tc.text}</span>
                <span class="status-badge ${statusClass}">${statusText}</span>
                ${isHoje ? `<span class="badge badge-blue"><i class="fas fa-clock"></i> Hoje</span>` : ''}
                ${temMensagemExtra ? `<span class="mensagem-extra-badge" title="${escaparHTML(t.mensagem_extra)}"><i class="fas fa-comment"></i> ${escaparHTML(t.mensagem_extra.substring(0, 20))}${t.mensagem_extra.length > 20 ? '...' : ''}</span>` : ''}
                <span class="servico-tecnico"><i class="fas fa-user-cog"></i> ${escaparHTML(t.cliente_nome || 'Técnico não informado')}</span>
              </div>
              <!-- ===== DATA AGENDADA EM DESTAQUE ===== -->
              <div style="margin-top: 4px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap;">
                <span class="data-agendada ${dataAgendadaClass}" style="font-size: 0.75rem; font-weight: 600; padding: 2px 10px; background: var(--gray-50); border-radius: 12px; border: 1px solid var(--border-color);">
                  <i class="fas ${dataAgendadaIcon}"></i> ${dataAgendadaLabel}
                </span>
                <span style="font-size: 0.6rem; color: var(--text-secondary);">
                  <i class="fas fa-calendar-plus"></i> ${criadoEm}
                </span>
              </div>
            </div>
            <div class="servico-acoes">
              <a href="/api/templates/${t.id}/pdf-view" target="_blank" class="btn btn-sm" style="background:var(--red-light);color:var(--red);border:none" title="PDF"><i class="fas fa-eye"></i></a>
              ${t.has_txt?`<a href="/api/templates/${t.id}/txt" target="_blank" class="btn btn-sm" style="background:#DBEAFE;color:#1E40AF;border:none" title="TXT"><i class="fas fa-file-lines"></i></a>`:''}
              ${t.has_os?`<a href="/api/templates/${t.id}/os-pdf" target="_blank" class="btn btn-sm" style="background:#F3E8FF;color:#6B21A8;border:none" title="OS"><i class="fas fa-clipboard-list"></i></a>`:''}
              ${t.has_retirada?`<a href="/api/templates/${t.id}/retirada-pdf" target="_blank" class="btn btn-sm" style="background:#FFE4E6;color:#9F1239;border:none" title="Retirada"><i class="fas fa-box-open"></i></a>`:''}
              ${temMensagemExtra ? `<button class="btn btn-sm" style="background:#DBEAFE;color:#1E40AF;border:none" onclick="verMensagemExtra('${escaparHTML(t.mensagem_extra)}')" title="Ver mensagem extra"><i class="fas fa-comment-dots"></i></button>` : ''}
              <button class="btn btn-sm btn-danger-ghost remover-template" data-id="${t.id}" data-nome="${escaparHTML(t.nome)}" title="Remover"><i class="fas fa-trash"></i></button>
            </div>
          </div>
        `;
      });
    }
  }
  card.innerHTML = html;
  container.appendChild(card);

  // Event listeners para remover templates
  card.querySelectorAll('.remover-template').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = btn.dataset.id;
      const nome = btn.dataset.nome;
      showModalConfirm('Remover modelo', `Remover <strong>${nome}</strong>?<br><span style="font-size:.75rem;color:var(--text-secondary)">Esta ação não pode ser desfeita</span>`, async () => {
        try {
          const res = await authFetch(`/api/templates/${id}/delete`, { method: 'DELETE' });
          const data = await res.json();
          if (data.sucesso) { 
            showToast('Modelo removido!'); 
            if (state.mostrarTodosTemplates) {
              await carregarTodosTemplates();
            } else {
              await carregarTemplatesDoDia();
            }
            renderizarConteudoPrincipal(); 
          } else showToast(data.erro || 'Erro', 'error');
        } catch(e) {}
      }, 'Sim, remover');
    });
  });
}

// ===== TOGGLE MOSTRAR TODOS TEMPLATES =====
async function toggleMostrarTodosTemplates() {
  state.mostrarTodosTemplates = !state.mostrarTodosTemplates;
  if (state.mostrarTodosTemplates) {
    await carregarTodosTemplates();
  } else {
    await carregarTemplatesDoDia();
  }
  renderizarConteudoPrincipal();
}

// ========== ABA TECNICOS ==========
function renderizarAbaTecnicos(container) {
  const card = document.createElement('div');
  card.className = 'card';
  let html = `<div class="section-head">
    <div><div class="section-title"><i class="fas fa-users" style="color:var(--red)"></i> Tecnicos</div><div class="section-sub">Adicionar, desativar, reativar ou alterar senha</div></div>
  </div>
  <div style="padding:1rem 1.25rem;border-bottom:1px solid var(--border-color);background:var(--gray-50)">
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:.625rem;align-items:flex-end">
      <div><label>Nome</label><input id="tecNome" placeholder="Nome completo"></div>
      <div><label>Matricula</label><input id="tecMat" placeholder="Ex: TEC001"></div>
      <div><label>Senha</label><input id="tecSenha" type="text" placeholder="Deixe em branco para usar matricula"></div>
      <button id="addTecnicoBtn" class="btn btn-primary" style="align-self:flex-end"><i class="fas fa-plus"></i> Adicionar</button>
    </div>
  </div>`;

  if (state.tecnicos.length === 0) {
    html += `<div class="empty"><div class="empty-icon"><i class="fas fa-user-slash"></i></div><div class="empty-title">Nenhum tecnico</div></div>`;
  } else {
    state.tecnicos.forEach(t => {
      const inicial = (t.nome || '?').charAt(0).toUpperCase();
      html += `<div class="tec-row">
        <div class="tec-avatar">${inicial}</div>
        <div style="flex:1;min-width:0">
          <div class="tec-name">${escaparHTML(t.nome || '—')}</div>
          <div class="tec-mat">${escaparHTML(t.matricula || '—')}</div>
        </div>
        <div style="display:flex;align-items:center;gap:.75rem;flex-wrap:wrap;">
          ${t.ativo!==0 ? '<span style="display:inline-flex;align-items:center;gap:.4rem;font-size:.75rem;color:#16A34A;font-weight:600"><span class="dot dot-green"></span> Ativo</span>' : '<span style="display:inline-flex;align-items:center;gap:.4rem;font-size:.75rem;color:var(--text-secondary);font-weight:600"><span class="dot dot-gray"></span> Inativo</span>'}
          <button class="btn btn-edit-senha btn-sm" onclick="abrirModalAlterarSenha('${t.id}', '${escaparHTML(t.nome)}')" style="padding:3px 8px;font-size:10px;">
            <i class="fas fa-key"></i> Senha
          </button>
          <button class="btn ${t.ativo!==0?'btn-danger-ghost':'btn-green'} btn-sm toggle-tecnico" data-id="${t.id}" data-nome="${escaparHTML(t.nome)}" data-ativo="${t.ativo}"><i class="fas ${t.ativo!==0?'fa-ban':'fa-rotate-left'}"></i> ${t.ativo!==0?'Desativar':'Reativar'}</button>
        </div>
      </div>`;
    });
  }
  card.innerHTML = html;
  container.appendChild(card);

  document.getElementById('addTecnicoBtn')?.addEventListener('click', async () => {
    const nome = document.getElementById('tecNome').value.trim();
    const mat = document.getElementById('tecMat').value.trim();
    const senha = document.getElementById('tecSenha').value.trim() || mat;
    
    if (!nome || !mat) return showToast('Preencha os campos', 'error');
    
    try {
      const res = await authFetch('/api/tecnicos', { 
        method: 'POST', 
        headers: { 'Content-Type': 'application/json' }, 
        body: JSON.stringify({ nome, matricula: mat, senha }) 
      });
      const data = await res.json();
      if (data.sucesso) { 
        showToast(`Tecnico ${nome} adicionado! Senha: ${senha}`, 'success'); 
        await carregarDados(); 
        renderizarConteudoPrincipal(); 
      } else showToast(data.erro || 'Erro', 'error');
    } catch(e) {}
  });

  card.querySelectorAll('.toggle-tecnico').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = btn.dataset.id;
      const nome = btn.dataset.nome;
      const ativo = btn.dataset.ativo !== '0';
      const titulo = ativo ? 'Desativar' : 'Reativar';
      const mensagem = ativo ? `Desativar <strong>${nome}</strong>?` : `Reativar <strong>${nome}</strong>?`;
      showModalConfirm(titulo, mensagem, async () => {
        try {
          const res = await authFetch(`/api/tecnicos/${id}${ativo ? '' : '/reativar'}`, { method: ativo ? 'DELETE' : 'PUT' });
          const data = await res.json();
          if (data.sucesso) { showToast(`Tecnico ${nome} ${ativo ? 'desativado' : 'reativado'}!`); await carregarDados(); renderizarConteudoPrincipal(); }
          else showToast(data.erro || 'Erro', 'error');
        } catch(e) {}
      }, ativo ? 'Sim, desativar' : 'Sim, reativar', ativo ? undefined : 'success');
    });
  });
}
